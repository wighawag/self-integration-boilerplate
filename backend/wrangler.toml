name = "self-template-server"
main = "src/worker.ts"
compatibility_date = "2023-08-14"

compatibility_flags = [ "nodejs_compat" ] # for node:async_hooks

workers_dev = true
preview_urls = true

[observability.logs]
enabled = true

# Default values - override with environment-specific config
# For production, set SELF_ENDPOINT to your public URL
[vars]
SELF_SCOPE_SEED = "self-workshop"
SELF_ENDPOINT = "https://your-domain.com/api/verify"

